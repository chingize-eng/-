<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; }
  .stage { display:flex; flex-direction:column; gap:40px; padding:40px; align-items:flex-start; }
  canvas { display:block; }
  #full { background:#48443F; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="full" width="1800" height="1800"></canvas>
  <canvas id="mark" width="760" height="600"></canvas>
</div>
<script>
const BG = '#48443F';
const WHITE = '#FFFFFF';
const OFFWHITE = '#E7E4E0';

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// a lateral lumbar vertebra centred at (x,y): rounded body on the left, spinous process hooking right
function vertebra(ctx, x, y, w, h){
  // vertebral body
  const bw = w*0.58, bh = h*0.82;
  roundRect(ctx, x - w*0.52, y - bh/2, bw, bh, bh*0.30);
  ctx.fill();
  // spinous process (points right, angled slightly down)
  ctx.beginPath();
  ctx.moveTo(x + w*0.02, y - h*0.34);
  ctx.bezierCurveTo(x + w*0.34, y - h*0.40, x + w*0.56, y - h*0.12, x + w*0.52, y + h*0.14);
  ctx.bezierCurveTo(x + w*0.49, y + h*0.40, x + w*0.30, y + h*0.46, x + w*0.10, y + h*0.30);
  ctx.bezierCurveTo(x + w*0.03, y + h*0.20, x + w*0.02, y + h*0.02, x + w*0.02, y - h*0.34);
  ctx.closePath();
  ctx.fill();
}

// B, spine, D. cx centre, capTop top of caps, capH cap height
function drawMark(ctx, cx, capTop, capH){
  ctx.fillStyle = WHITE;
  ctx.font = '900 ' + capH*1.40 + "px 'Liberation Sans','Arial',sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const baseline = capTop + capH;
  ctx.fillText('B', cx - capH*0.52, baseline);
  ctx.fillText('D', cx + capH*0.52, baseline);
  // spine in the central channel, a touch taller than caps
  const n = 5;
  const top = capTop - capH*0.10;
  const bottom = baseline + capH*0.06;
  const step = (bottom - top)/n;
  const vw = capH*0.46, vh = step*0.96;
  for(let i=0;i<n;i++){
    const y = top + step*(i+0.5);
    const sway = Math.sin((i/(n-1))*Math.PI) * capH*0.015;
    vertebra(ctx, cx + sway, y, vw, vh);
  }
}

// fit a font size so text width <= targetW
function fitSize(ctx, text, targetW, weight, family, guess){
  ctx.font = weight+' '+guess+'px '+family;
  const w = ctx.measureText(text).width;
  return Math.min(guess, guess*targetW/w);
}
function drawSpaced(ctx, text, cx, y, ls){
  ctx.textAlign='left';
  let total=0; for(const ch of text){ total += ctx.measureText(ch).width + ls; } total-=ls;
  let x = cx-total/2;
  for(const ch of text){ ctx.fillText(ch,x,y); x += ctx.measureText(ch).width + ls; }
}

// ---------- FULL LOGO ----------
(function(){
  const c = document.getElementById('full');
  const ctx = c.getContext('2d');
  ctx.fillStyle = BG; ctx.fillRect(0,0,c.width,c.height);
  const cx = c.width/2;
  drawMark(ctx, cx, 545, 430);
  // Korean name (auto-fit to width)
  const korFam = "'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
  const kor = '미금본닥터정형외과의원';
  const ksize = fitSize(ctx, kor, 1480, '800', korFam, 210);
  ctx.fillStyle = WHITE; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font = '800 '+ksize+'px '+korFam;
  ctx.fillText(kor, cx, 1200);
  // English caption (auto-fit incl. letter spacing)
  const engFam = "'Liberation Sans','Arial',sans-serif";
  const eng = 'MIGEUM BONE DOCTOR ORTHOPEDICS';
  let esize = 96, els = 8;
  ctx.font = '500 '+esize+'px '+engFam;
  let ew=0; for(const ch of eng){ ew += ctx.measureText(ch).width + els; } ew-=els;
  if(ew>1480){ const k=1480/ew; esize*=k; els*=k; }
  ctx.font = '500 '+esize+'px '+engFam;
  ctx.fillStyle = OFFWHITE;
  drawSpaced(ctx, eng, cx, 1320, els);
})();

// ---------- MARK ONLY (symbol, transparent white) ----------
(function(){
  const c = document.getElementById('mark');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  drawMark(ctx, c.width/2, 90, 400);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #EEF4F5;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  }
  .frame { width: 1000px; padding: 60px; display: flex; }
  .clinic {
    width: 100%;
    background: linear-gradient(155deg, #157C81 0%, #1B8A8F 55%, #23A0A0 100%);
    color: #fff; border-radius: 32px; padding: 56px 58px;
    box-shadow: 0 30px 70px rgba(21,124,129,.35);
    position: relative; overflow: hidden;
  }
  .clinic::after {
    content: ""; position: absolute; right: -90px; top: -90px;
    width: 340px; height: 340px; border-radius: 50%; background: rgba(255,255,255,.08);
  }
  .clinic::before {
    content: ""; position: absolute; right: 30px; bottom: -140px;
    width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,.06);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.18); padding: 12px 24px; border-radius: 999px;
    font-size: 23px; font-weight: 700; margin-bottom: 24px; position: relative;
  }
  .k { font-size: 19px; letter-spacing: .16em; text-transform: uppercase; opacity: .82; font-weight: 700; margin-bottom: 12px; position: relative; }
  h1 { font-size: 46px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 34px; position: relative; }

  .info { display: grid; gap: 20px; position: relative; }
  .row { display: flex; align-items: flex-start; gap: 18px; }
  .row .ic {
    flex: none; width: 46px; height: 46px; border-radius: 13px;
    background: rgba(255,255,255,.18); display: grid; place-items: center;
    font-size: 24px; margin-top: 2px;
  }
  .row .body { padding-top: 2px; }
  .row .lab { font-size: 18px; font-weight: 700; opacity: .78; letter-spacing: .04em; margin-bottom: 5px; }
  .row .val { font-size: 27px; font-weight: 700; line-height: 1.4; }
  .row .val.big { font-size: 32px; font-weight: 800; letter-spacing: .01em; }
  .row .val .sub { display: block; font-size: 21px; font-weight: 600; opacity: .9; margin-top: 3px; }
  .row .val b { font-weight: 800; }

  .divider { height: 1px; background: rgba(255,255,255,.2); margin: 4px 0; position: relative; }
</style>
</head>
<body>
  <div class="frame">
    <div class="clinic">
      <div class="badge">🖐️ 수부외과 세부전문의 진료</div>
      <div class="k">Migeum Bon Doctor Orthopedics</div>
      <h1>미금본닥터정형외과의원</h1>

      <div class="info">
        <div class="row">
          <span class="ic">🏥</span>
          <div class="body">
            <div class="lab">진료과목</div>
            <div class="val">정형외과 &nbsp;|&nbsp; <b>수부외과 세부전문의</b></div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <span class="ic">📌</span>
          <div class="body">
            <div class="lab">위치</div>
            <div class="val">경기도 성남시 분당구 돌마로 87 골드프라자 5층
              <span class="sub">미금역 2번 출구 · 국민은행 건물</span>
            </div>
          </div>
        </div>

        <div class="row">
          <span class="ic">📞</span>
          <div class="body">
            <div class="lab">진료 예약 및 문의</div>
            <div class="val big">031-715-1119</div>
          </div>
        </div>

        <div class="row">
          <span class="ic">🕐</span>
          <div class="body">
            <div class="lab">진료시간</div>
            <div class="val" style="line-height:1.5;">월·수·금 09:00 – 19:00<br>화·목 09:00 – 20:00 &nbsp;·&nbsp; 토 09:00 – 14:00</div>
          </div>
        </div>

        <div class="row">
          <span class="ic">💻</span>
          <div class="body">
            <div class="lab">홈페이지</div>
            <div class="val">www.mbonedoctor.com</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

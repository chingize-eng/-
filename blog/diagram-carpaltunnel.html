<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#DDE7E8; font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; }
  .frame { width:1000px; padding:56px; }
  .card { background:#FBFDFD; border:1px solid #E3E9EB; border-radius:28px; padding:44px 48px 40px; box-shadow:0 20px 50px rgba(24,40,48,.10); position:relative; }
  .ttl { display:flex; align-items:center; gap:12px; font-size:27px; font-weight:800; color:#157C81; letter-spacing:-.01em; margin-bottom:6px; }
  .sub { font-size:18px; color:#7C8B90; margin-bottom:18px; }
  .brand { position:absolute; right:48px; bottom:34px; font-size:17px; font-weight:700; color:#B4C3C6; }
  svg { width:100%; height:auto; display:block; }
  .lab { font-size:23px; font-weight:700; fill:#2C3C42; }
  .lab.accent { fill:#D64545; }
  .lab.small { font-size:19px; font-weight:600; fill:#5C6B72; }
  .lead { stroke:#9DAFB3; stroke-width:2.5; fill:none; }
  .lead.accent { stroke:#D64545; }
</style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="ttl">🖐️ 손목터널(수근관) 단면 구조</div>
      <div class="sub">좁은 통로 안에서 정중신경이 눌리면 손저림이 생깁니다</div>
      <svg viewBox="0 0 900 560" role="img" aria-label="수근관 단면 다이어그램">
        <!-- carpal bones arch (U shape) -->
        <g fill="#EAE0D2" stroke="#D8C9B2" stroke-width="3">
          <path d="M250,470 C150,470 120,380 140,300 C155,235 210,210 250,235 C230,300 235,400 285,455 C275,465 262,470 250,470 Z"/>
          <ellipse cx="200" cy="300" rx="52" ry="46"/>
          <ellipse cx="235" cy="220" rx="46" ry="42"/>
          <ellipse cx="330" cy="185" rx="46" ry="42"/>
          <ellipse cx="565" cy="185" rx="46" ry="42"/>
          <ellipse cx="660" cy="220" rx="46" ry="42"/>
          <ellipse cx="700" cy="300" rx="52" ry="46"/>
          <path d="M650,470 C750,470 780,380 760,300 C745,235 690,210 650,235 C670,300 665,400 615,455 C625,465 638,470 650,470 Z"/>
        </g>
        <!-- transverse carpal ligament (roof band) -->
        <rect x="235" y="150" width="430" height="46" rx="23" fill="#F2C879" stroke="#E0AE56" stroke-width="3"/>
        <!-- flexor tendons -->
        <g fill="#CFD8DC" stroke="#AEBBC0" stroke-width="3">
          <circle cx="330" cy="330" r="42"/>
          <circle cx="425" cy="360" r="42"/>
          <circle cx="520" cy="330" r="42"/>
          <circle cx="378" cy="255" r="34"/>
          <circle cx="472" cy="255" r="34"/>
          <circle cx="565" cy="300" r="34"/>
        </g>
        <!-- median nerve (compressed, top centre) -->
        <ellipse cx="450" cy="235" rx="60" ry="30" fill="#E86A6A" stroke="#C94141" stroke-width="3"/>
        <text x="450" y="243" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">정중신경</text>
        <!-- leaders + labels -->
        <path class="lead accent" d="M450,205 C450,120 560,110 630,96"/>
        <text class="lab accent" x="640" y="103">정중신경 (눌리는 신경)</text>
        <path class="lead" d="M655,173 C740,173 760,150 790,132"/>
        <text class="lab small" x="640" y="150" text-anchor="end">가로손목인대</text>
        <path class="lead" d="M425,402 C425,470 320,485 250,498"/>
        <text class="lab small" x="240" y="505" text-anchor="end">굴곡건(힘줄)</text>
      </svg>
      <div class="brand">미금본닥터정형외과의원</div>
    </div>
  </div>
</body>
</html>
